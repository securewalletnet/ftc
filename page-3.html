<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Secure Wallet - Identity Verification</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f6f8;
      color: #1d1d1f;
    }
    header, footer {
      background-color: #112a46;
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
    }
    .logo img {
      height: 32px;
      margin-right: 10px;
    }
    .menu-icon {
      font-size: 24px;
      cursor: pointer;
    }
    .slide-menu {
      position: fixed;
      top: 0;
      left: -100%;
      height: 100%;
      width: 50%;
      background-color: #fff;
      box-shadow: 2px 0 10px rgba(0,0,0,0.2);
      padding: 20px;
      transition: left 0.3s ease;
      z-index: 999;
    }
    .slide-menu.active {
      left: 0;
    }
    .slide-menu a {
      display: block;
      margin: 15px 0;
      text-decoration: none;
      color: #112a46;
      font-weight: 600;
    }
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.3);
      z-index: 998;
    }
    .overlay.active {
      display: block;
    }
    .container {
      padding: 40px 20px;
      max-width: 700px;
      margin: auto;
      text-align: center;
    }
    .steps {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .step {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #ccc;
      line-height: 60px;
      color: white;
      font-weight: bold;
      position: relative;
    }
    .step.active {
      background-color: #28a745;
    }
    .line {
      flex: 1;
      height: 4px;
      background-color: #ccc;
      margin: 0 10px;
    }
    .line.active {
      background-color: #28a745;
    }
    .form-step {
      display: none;
    }
    .form-step.active {
      display: block;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-top: 20px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    video {
      margin-top: 20px;
      width: 100%;
      max-height: 300px;
      border-radius: 10px;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #0071e3;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    footer {
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="ftc wallet.jpeg" alt="MACS Logo" />
      Secure Wallet
    </div>
    <div class="menu-icon" onclick="toggleMenu()">&#9776;</div>
  </header>

  <div class="slide-menu" id="slideMenu">
    <a href="index.html">Home</a>
    <a href="page-2.html">Create an Account</a>
    <a href="page-2.html">Log In</a>
    <a href="#">Support</a>
  </div>
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <div class="container">
    <h2>Identity Verification</h2>
    <div class="steps">
      <div class="step active" id="step1">1</div>
      <div class="line" id="line1"></div>
      <div class="step" id="step2">2</div>
      <div class="line" id="line2"></div>
      <div class="step" id="step3">3</div>
      <div class="line" id="line3"></div>
      <div class="step" id="step4">4</div>
    </div>

    <div class="form-step active" id="form1">
      <p>Choose a secure 4-digit PIN</p>
      <input type="password" maxlength="4" placeholder="Enter PIN">
      <button onclick="nextStep(1)">Apply</button>
    </div>

    <div class="form-step" id="form2">
      <p>Type your device IP address to link</p>
      <input type="text" placeholder="e.g. 192.168.1.10">
      <button onclick="nextStep(2)">Apply</button>
    </div>

    <div class="form-step" id="form3">
      <p>Scan your face to verify identity</p>
      <video id="camera" autoplay playsinline muted></video>
      <button onclick="startCamera()">Start Camera</button>
      <p style="margin-top: 20px;">Or upload a selfie</p>
      <input type="file" accept="image/*" id="selfieInput">
      <button onclick="nextStep(3)">Apply</button>
    </div>

    <div class="form-step" id="form4">
      <p>Upload a Government-issued Photo ID</p>
      <input type="file" accept="image/*" id="idInput">
      <button onclick="nextStep(4)">Apply</button>
    </div>

    <button id="continueBtn" style="display:none;" onclick="location.href='page-4.html'">Continue</button>
  </div>

  <footer>
    &copy; 2025 MACS Corporation. All rights reserved.
  </footer>

  <script>
    function toggleMenu() {
      document.getElementById('slideMenu').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }

    function checkAllStepsCompleted() {
      const steps = [1, 2, 3, 4];
      const allCompleted = steps.every(i => {
        return document.getElementById(`step${i}`).classList.contains('active');
      });
      if (allCompleted) {
        document.getElementById("continueBtn").style.display = "inline-block";
      }
    }

    function nextStep(current) {
      document.getElementById(`form${current}`).classList.remove('active');
      document.getElementById(`step${current}`).classList.add('active');

      if (current < 4) {
        if (document.getElementById(`line${current}`)) {
          document.getElementById(`line${current}`).classList.add('active');
        }
        document.getElementById(`step${current + 1}`).classList.add('active');
        document.getElementById(`form${current + 1}`).classList.add('active');
      } else {
        const fileInput = document.getElementById("idInput");
        if (fileInput && fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const reader = new FileReader();
          reader.onload = function () {
            localStorage.setItem("uploadedID", reader.result);
            checkAllStepsCompleted();
          };
          reader.readAsDataURL(file);
        } else {
          checkAllStepsCompleted();
        }
      }
    }

    function startCamera() {
      const video = document.getElementById('camera');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Your browser does not support camera access.');
        return;
      }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
        .then(stream => {
          video.srcObject = stream;
          video.play();
        })
        .catch(err => {
          alert('Camera access denied or not available: ' + err.message);
        });
    }
  </script>
</body>
</html>
